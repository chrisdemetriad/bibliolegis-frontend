name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The backend's schema can change without anything happening in this repo, so
  # the drift job also runs daily to catch that between frontend PRs
  schedule:
    - cron: "0 6 * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated API types match openapi.json
        run: |
          pnpm api:types
          git diff --exit-code -- src/api/schema.gen.ts
      - run: pnpm typecheck
      - run: pnpm build

  schema-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # bibliolegis-api is private, so this reads it with a read only deploy key
      # on that repo. A deploy key rather than a token because it's scoped to
      # the one repo and doesn't expire. Without the secret the job warns rather
      # than fails, so a missing secret doesn't block every PR here
      - name: openapi.json matches bibliolegis-api main
        env:
          DEPLOY_KEY: ${{ secrets.API_REPO_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::API_REPO_DEPLOY_KEY isn't set, skipping the check against bibliolegis-api"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/api_repo
          chmod 600 ~/.ssh/api_repo
          # GitHub's published host keys, fetched over HTTPS, rather than
          # trusting whatever answers the first SSH connection
          curl -fsSL https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/api_repo -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 --filter=blob:none --no-checkout \
            git@github.com:chrisdemetriad/bibliolegis-api.git /tmp/api
          git -C /tmp/api show HEAD:openapi.json > /tmp/api-openapi.json
          if ! diff -u openapi.json /tmp/api-openapi.json; then
            echo "::error::openapi.json is behind bibliolegis-api main, run pnpm api:sync and commit the result"
            exit 1
          fi
